const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
 const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));const html=new TextDecoder().decode(pt);
 try{sessionStorage.setItem('lp_pw',pw)}catch(e){}
 history.replaceState(null,'',location.pathname+location.search);document.open();document.write(html);document.close()}
async function tryPw(pw,quiet){try{await open_(pw)}catch(e){if(!quiet)document.getElementById('err').textContent='密碼不正確 · Wrong password'}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();tryPw(document.getElementById('pw').value)};
const h=new URLSearchParams(location.hash.slice(1)).get('pw');let saved=null;try{saved=sessionStorage.getItem('lp_pw')}catch(e){}
if(h)tryPw(h);else if(saved)tryPw(saved,true);
